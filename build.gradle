plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'utb.fai'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
    // Jádro pro REST API (obsahuje webový server Tomcat a podporu pro JSON)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Práce s databází přes anotace @Entity a repozitáře (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // H2 databáze pro lokální běh i testování (perzistentní na disku bez nutnosti externího DB serveru)
    runtimeOnly 'com.h2database:h2'

    // Standardní nástroje pro testování
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
